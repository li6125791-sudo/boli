<title>Boli 账本</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: app shell — sticky top bar with period + display-currency switch, tabbed views
   (概览 / 流水 / 客户 / 汇率), bottom tab bar on phones, slide-up sheet for entry forms. */
:root{
  --bg:#eef2f1; --panel:#ffffff; --panel-2:#f6f9f8; --line:#dbe3e1; --ink:#14211f; --muted:#5f716d;
  --accent:#145c52; --accent-ink:#ffffff; --accent-soft:#dcefe9;
  --in:#13805f; --in-soft:#dff3ea; --out:#c0442f; --out-soft:#fbe5df; --warn:#b7791f; --warn-soft:#fbefd9;
  --usd:#2f6f3e; --kzt:#0a8db0; --cny:#c23a2b;
  --shadow:0 1px 2px rgba(20,33,31,.06),0 8px 24px rgba(20,33,31,.06);
  --f-ui:"Manrope","PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",system-ui,sans-serif;
  --f-num:"JetBrains Mono","SFMono-Regular",Menlo,Consolas,monospace;
  --r:12px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e1514; --panel:#152020; --panel-2:#1a2726; --line:#2a3a38; --ink:#e6efed; --muted:#93a6a2;
  --accent:#5cc4ae; --accent-ink:#0b1514; --accent-soft:#1d3a35;
  --in:#4fcf9d; --in-soft:#173a2e; --out:#f0806b; --out-soft:#3d221d; --warn:#e7b35a; --warn-soft:#3a2f1a;
  --usd:#7fc98f; --kzt:#4cc6e6; --cny:#f08070;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1514; --panel:#152020; --panel-2:#1a2726; --line:#2a3a38; --ink:#e6efed; --muted:#93a6a2;
  --accent:#5cc4ae; --accent-ink:#0b1514; --accent-soft:#1d3a35;
  --in:#4fcf9d; --in-soft:#173a2e; --out:#f0806b; --out-soft:#3d221d; --warn:#e7b35a; --warn-soft:#3a2f1a;
  --usd:#7fc98f; --kzt:#4cc6e6; --cny:#f08070;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--panel)}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--panel);border-bottom:1px solid var(--line)}
.top-in{max-width:1180px;margin:0 auto;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:17px;letter-spacing:-.01em;margin-right:auto}
.mark{width:30px;height:30px;border-radius:8px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-family:var(--f-num);font-size:13px;font-weight:600}
.brand small{display:block;font-weight:500;font-size:11px;color:var(--muted);letter-spacing:.02em}
.tabs{display:flex;gap:2px;background:var(--panel-2);border:1px solid var(--line);border-radius:10px;padding:3px}
.tabs button{border:0;background:none;padding:6px 12px;border-radius:7px;cursor:pointer;color:var(--muted);font-weight:600}
.tabs button[aria-selected="true"]{background:var(--panel);color:var(--ink);box-shadow:var(--shadow)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;background:var(--panel-2)}
.seg button{border:0;background:none;padding:6px 10px;cursor:pointer;color:var(--muted);font-weight:600;min-width:38px}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.ctrls{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
select.pill,input.pill{border:1px solid var(--line);background:var(--panel-2);border-radius:9px;padding:6px 10px;min-height:34px}

/* main */
main{max-width:1180px;margin:0 auto;padding-block:18px 120px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:16px}
.banner{display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:var(--warn-soft);border:1px solid color-mix(in srgb,var(--warn) 35%,transparent);color:var(--ink);padding:10px 14px;border-radius:var(--r);font-size:13px}
.banner b{color:var(--warn)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px;min-width:0}
.card h2{margin:0 0 12px;font-size:13px;font-weight:700;letter-spacing:.04em;color:var(--muted);text-transform:uppercase;display:flex;align-items:center;gap:8px;justify-content:space-between}
.card h2 .hint{font-weight:500;text-transform:none;letter-spacing:0}
.grid{display:grid;gap:16px}
.g-kpi{grid-template-columns:repeat(4,minmax(0,1fr))}
.g-2{grid-template-columns:minmax(0,1.6fr) minmax(0,1fr)}
.g-3{grid-template-columns:repeat(3,minmax(0,1fr))}
@media (max-width:900px){.g-kpi{grid-template-columns:repeat(2,minmax(0,1fr))}.g-2,.g-3{grid-template-columns:minmax(0,1fr)}}

.kpi{display:grid;gap:4px;align-content:start}
.kpi .lbl{font-size:12px;color:var(--muted);font-weight:600;letter-spacing:.03em}
.kpi .val{font-family:var(--f-num);font-variant-numeric:tabular-nums;font-size:clamp(19px,2.6vw,26px);font-weight:600;line-height:1.15;overflow-wrap:anywhere}
.kpi .sub{font-size:12px;color:var(--muted)}
.kpi.in .val{color:var(--in)} .kpi.out .val{color:var(--out)}
.kpi.profit{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.kpi.profit .lbl,.kpi.profit .sub{color:color-mix(in srgb,var(--accent-ink) 78%,transparent)}

.chip{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;padding:2px 7px;border-radius:999px;letter-spacing:.03em;white-space:nowrap}
.c-USD{color:var(--usd);background:color-mix(in srgb,var(--usd) 13%,transparent)}
.c-KZT{color:var(--kzt);background:color-mix(in srgb,var(--kzt) 13%,transparent)}
.c-CNY{color:var(--cny);background:color-mix(in srgb,var(--cny) 13%,transparent)}
.st-pending{color:var(--warn);background:var(--warn-soft)}
.t-in{color:var(--in);background:var(--in-soft)} .t-out{color:var(--out);background:var(--out-soft)} .t-fx{color:var(--accent);background:var(--accent-soft)}

/* balances */
.bal{display:grid;gap:10px}
.bal-row{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:10px 12px;border-radius:10px;background:var(--panel-2)}
.bal-row .sym{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;font-weight:700;font-size:16px}
.bal-row .amt{font-family:var(--f-num);font-variant-numeric:tabular-nums;font-weight:600;font-size:16px;text-align:right}
.bal-row .nm{font-size:12px;color:var(--muted)}

/* bars */
.hbar{display:grid;gap:8px}
.hbar-row{display:grid;grid-template-columns:minmax(0,7em) minmax(0,1fr) auto;gap:10px;align-items:center;font-size:13px}
.hbar-row .lab{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hbar-track{height:10px;border-radius:6px;background:var(--panel-2);overflow:hidden}
.hbar-fill{height:100%;border-radius:6px}
.empty-note{color:var(--muted);font-size:13px;padding:8px 0}

.chart-wrap{overflow-x:auto}
.chart-wrap svg{display:block;width:100%;min-width:520px;height:auto}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}

/* ledger */
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.filters .grow{flex:1 1 180px;min-width:0}
.sumbar{display:flex;flex-wrap:wrap;gap:8px 20px;font-size:13px;color:var(--muted);padding:10px 12px;background:var(--panel-2);border-radius:10px}
.sumbar b{font-family:var(--f-num);font-weight:600;color:var(--ink)}
.rows{display:grid}
.row{display:grid;grid-template-columns:88px minmax(0,1fr) auto auto;gap:12px;align-items:center;padding:12px 4px;border-bottom:1px solid var(--line);cursor:pointer}
.row:hover{background:var(--panel-2)}
.row:last-child{border-bottom:0}
.row .d{font-family:var(--f-num);font-size:12px;color:var(--muted)}
.row .who{min-width:0}
.row .who b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:700}
.row .who span{font-size:12px;color:var(--muted);display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.row .amt{text-align:right;font-family:var(--f-num);font-variant-numeric:tabular-nums;font-weight:600;white-space:nowrap}
.row .amt small{display:block;font-weight:400;font-size:11px;color:var(--muted)}
.row .conv{text-align:right;font-family:var(--f-num);font-size:13px;color:var(--muted);white-space:nowrap;min-width:92px}
.pos{color:var(--in)} .neg{color:var(--out)}
@media (max-width:620px){.row{grid-template-columns:minmax(0,1fr) auto}.row .d{grid-column:1/-1;margin-bottom:-6px}.row .conv{display:none}}

/* clients */
.clients{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.client{display:grid;gap:10px;cursor:pointer}
.client:hover{border-color:var(--accent)}
.client .hd{display:flex;justify-content:space-between;gap:8px;align-items:start}
.client .hd b{font-size:16px}
.client .hd span{font-size:12px;color:var(--muted)}
.client .figs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.client .figs div{background:var(--panel-2);border-radius:8px;padding:6px 8px;min-width:0}
.client .figs small{display:block;font-size:11px;color:var(--muted)}
.client .figs .num{font-size:13px;font-weight:600;overflow-wrap:anywhere}
.margin-bar{height:6px;border-radius:4px;background:var(--out-soft);overflow:hidden}
.margin-bar i{display:block;height:100%;background:var(--in)}

/* buttons */
.btn{border:1px solid var(--line);background:var(--panel);border-radius:9px;padding:8px 14px;cursor:pointer;font-weight:700;min-height:36px;display:inline-flex;align-items:center;gap:6px}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.danger{color:var(--out);border-color:color-mix(in srgb,var(--out) 40%,transparent)}
.btn.danger.armed{background:var(--out);color:#fff}
.btn.ghost{border-color:transparent;background:none}
.fab{position:fixed;right:calc(18px + env(safe-area-inset-right,0px));bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:8;border:0;border-radius:16px;padding:14px 20px;background:var(--accent);color:var(--accent-ink);font-weight:800;font-size:15px;box-shadow:0 10px 30px rgba(20,92,82,.35);cursor:pointer;display:flex;gap:8px;align-items:center}
@media (max-width:720px){
  .tabs{display:none}
  .bnav{display:grid}
  .fab{bottom:calc(78px + env(safe-area-inset-bottom,0px))}
  main{padding-bottom:160px}
}
.bnav{display:none;position:fixed;left:0;right:0;bottom:0;z-index:8;background:var(--panel);border-top:1px solid var(--line);grid-template-columns:repeat(4,1fr);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.bnav button{border:0;background:none;padding:10px 0 12px;font-weight:700;font-size:12px;color:var(--muted);display:grid;gap:2px;justify-items:center;cursor:pointer}
.bnav button svg{width:20px;height:20px}
.bnav button[aria-selected="true"]{color:var(--accent)}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(10,20,18,.45);z-index:20;display:grid;place-items:end center}
@media (min-width:721px){.scrim{place-items:center}}
.sheet{background:var(--panel);width:min(640px,100%);max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:18px max(16px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:grid;gap:14px}
@media (min-width:721px){.sheet{border-radius:18px;padding:22px}}
.sheet h3{margin:0;font-size:18px;display:flex;justify-content:space-between;align-items:center}
.fgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.fgrid .full{grid-column:1/-1}
@media (max-width:460px){.fgrid{grid-template-columns:minmax(0,1fr)}}
.field{display:grid;gap:5px;min-width:0}
.field label{font-size:12px;font-weight:700;color:var(--muted);letter-spacing:.02em}
.field input,.field select,.field textarea{border:1px solid var(--line);background:var(--panel-2);border-radius:9px;padding:9px 11px;width:100%;min-width:0}
.field input.big{font-family:var(--f-num);font-size:20px;font-weight:600}
.typeseg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.typeseg button{border:1px solid var(--line);background:var(--panel-2);border-radius:10px;padding:10px;font-weight:800;cursor:pointer;color:var(--muted)}
.typeseg button[data-t="in"][aria-pressed="true"]{background:var(--in);border-color:var(--in);color:#fff}
.typeseg button[data-t="out"][aria-pressed="true"]{background:var(--out);border-color:var(--out);color:#fff}
.typeseg button[data-t="fx"][aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.curseg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.curseg button{border:1px solid var(--line);background:var(--panel-2);border-radius:9px;padding:8px;font-weight:700;cursor:pointer}
.curseg button[aria-pressed="true"]{border-color:var(--ink);background:var(--panel);box-shadow:inset 0 0 0 1px var(--ink)}
.calc{background:var(--panel-2);border:1px dashed var(--line);border-radius:10px;padding:12px;display:grid;gap:6px;font-size:13px}
.calc .r{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.calc .r b{font-family:var(--f-num);font-weight:600}
.calc .hl{font-size:15px}
.sheet-actions{display:flex;gap:8px;justify-content:space-between;flex-wrap:wrap}
.sheet-actions .right{display:flex;gap:8px;margin-left:auto}
.err{color:var(--out);font-size:13px}

/* rates */
.rate-big{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.rate-box{background:var(--panel-2);border-radius:10px;padding:12px;display:grid;gap:6px}
.rate-box label{font-size:12px;font-weight:700;color:var(--muted)}
.rate-box input{border:1px solid var(--line);background:var(--panel);border-radius:9px;padding:9px 11px;font-family:var(--f-num);font-size:18px;font-weight:600;width:100%}
.matrix{width:100%;border-collapse:collapse;font-size:13px}
.matrix th,.matrix td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:right}
.matrix th:first-child,.matrix td:first-child{text-align:left}
.matrix td{font-family:var(--f-num)}
.table-wrap{overflow-x:auto}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(90px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:700;z-index:30;font-size:13px}
.loading{padding:40px 0;text-align:center;color:var(--muted)}
.emptystate{text-align:center;padding:36px 16px;display:grid;gap:10px;justify-items:center}
.emptystate h3{margin:0;font-size:18px}
.emptystate p{margin:0;color:var(--muted);max-width:42ch}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .22s ease-out}@keyframes up{from{transform:translateY(24px);opacity:.4}}}
</style>

<header class="top"><div class="top-in">
  <div class="brand"><span class="mark">B</span><div>Boli 账本<small>USD · KZT · CNY 进出账</small></div></div>
  <nav class="tabs" role="tablist" id="tabs">
    <button role="tab" data-v="dash">概览</button>
    <button role="tab" data-v="ledger">流水</button>
    <button role="tab" data-v="clients">客户</button>
    <button role="tab" data-v="rates">汇率</button>
  </nav>
  <div class="ctrls">
    <select class="pill" id="period" aria-label="统计期间">
      <option value="month">本月</option><option value="lastmonth">上月</option><option value="quarter">近3个月</option>
      <option value="year">今年</option><option value="all">全部</option><option value="custom">自定义…</option>
    </select>
    <span id="customRange" hidden class="ctrls"><input type="date" class="pill" id="from" aria-label="开始日期"><input type="date" class="pill" id="to" aria-label="结束日期"></span>
    <div class="seg" id="dispCur" aria-label="折算币种">
      <button data-c="CNY" title="按人民币折算">¥</button><button data-c="USD" title="按美元折算">$</button><button data-c="KZT" title="按坚戈折算">₸</button>
    </div>
  </div>
</div></header>

<main id="main"><div class="loading">正在打开账本…</div></main>

<button class="fab" id="fab" type="button"><span style="font-size:20px;line-height:1">＋</span>记一笔</button>
<nav class="bnav" id="bnav">
  <button data-v="dash"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>概览</button>
  <button data-v="ledger"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg>流水</button>
  <button data-v="clients"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="8" r="4"/><path d="M2 21c0-4 3-6 7-6s7 2 7 6M17 11a3 3 0 1 0 0-6M22 21c0-3-2-5-5-5.5"/></svg>客户</button>
  <button data-v="rates"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 8h14l-4-4M20 16H6l4 4"/></svg>汇率</button>
</nav>
<div id="modal"></div>

<script>
(function(){
"use strict";
const CURS=["CNY","USD","KZT"];
const SYM={CNY:"¥",USD:"$",KZT:"₸"};
const CNAME={CNY:"人民币",USD:"美元",KZT:"坚戈"};
const CATS={in:["货款","服务费","佣金","退款","其他收入"],out:["采购成本","运费物流","关税清关","佣金提成","工资","房租办公","银行手续费","其他支出"],fx:["换汇"]};
const DEFAULT_SETTINGS={rates:{CNY:7.10,KZT:505},updated:""};

const S={mode:"loading",txns:new Map(),clients:new Map(),settings:{...DEFAULT_SETTINGS,rates:{...DEFAULT_SETTINGS.rates}},
  view:"dash",disp:"CNY",period:"month",from:"",to:"",lf:{q:"",type:"",cur:"",client:"",cat:"",status:""},ready:{t:false,c:false,s:false},stale:false};
let db=null,downloads=null;

/* ---------- utils ---------- */
const $=s=>document.querySelector(s);
const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const today=()=>{const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")};
const num=v=>{const n=parseFloat(String(v??"").replace(/[,\s]/g,""));return isFinite(n)?n:0};
function fmt(n,cur,opts={}){
  const dec=opts.dec??(cur==="KZT"?0:2);
  const s=Math.abs(n).toLocaleString("en-US",{minimumFractionDigits:dec,maximumFractionDigits:dec});
  const sign=n<0?"−":(opts.plus&&n>0?"+":"");
  return sign+(cur?SYM[cur]:"")+s;
}
function compact(n,cur){
  const a=Math.abs(n);let v=n,u="";
  if(a>=1e8){v=n/1e8;u="亿"}else if(a>=1e4){v=n/1e4;u="万"}
  return (n<0?"−":"")+SYM[cur]+Math.abs(v).toLocaleString("en-US",{maximumFractionDigits:u?2:0})+u;
}
const rfmt=(n,d=4)=>(+n).toLocaleString("en-US",{maximumFractionDigits:d});
function toast(msg){const t=document.createElement("div");t.className="toast";t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),2200)}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,8)}

/* rates are "units per 1 USD" stored on every transaction */
function rateOf(rates,c){return c==="USD"?1:num(rates&&rates[c])||num(S.settings.rates[c])||1}
function conv(amount,from,to,rates){return amount/rateOf(rates,from)*rateOf(rates,to)}
function crossRate(rates,a,b){return rateOf(rates,b)/rateOf(rates,a)} // 1 a = ? b

/* per-transaction derived values in display currency */
function txValue(t,D){
  const r=t.rates,a=num(t.amount),f=num(t.fee);
  if(t.type==="in") return {inc:conv(a-f,t.currency,D,r),exp:0,fx:0};
  if(t.type==="out") return {inc:0,exp:conv(a+f,t.currency,D,r),fx:0};
  const gave=conv(a+f,t.currency,D,r),got=conv(num(t.toAmount),t.toCurrency,D,r);
  return {inc:0,exp:0,fx:got-gave};
}

/* ---------- storage ---------- */
const LS_KEY="boli-ledger-v1";
function lsLoad(){try{const raw=localStorage.getItem(LS_KEY);if(!raw)return;const o=JSON.parse(raw);
  (o.txns||[]).forEach(t=>S.txns.set(t.id,t));(o.clients||[]).forEach(c=>S.clients.set(c.id,c));if(o.settings)S.settings=o.settings;}catch(e){}}
function lsSave(){try{localStorage.setItem(LS_KEY,JSON.stringify({txns:[...S.txns.values()],clients:[...S.clients.values()],settings:S.settings}))}catch(e){}}
function strip(o){const c={...o};delete c.id;return c}
async function saveTxn(t){
  if(!t.id) t.id=db?db.collection("txns").doc().id:uid();
  if(db){await db.collection("txns").doc(t.id).set(strip(t))}else{S.txns.set(t.id,t);lsSave();render()}
}
async function delTxn(id){if(db){await db.collection("txns").doc(id).delete()}else{S.txns.delete(id);lsSave();render()}}
async function saveClient(c){
  if(!c.id) c.id=db?db.collection("clients").doc().id:uid();
  if(db){await db.collection("clients").doc(c.id).set(strip(c))}else{S.clients.set(c.id,c);lsSave();render()}
}
async function delClient(id){if(db){await db.collection("clients").doc(id).delete()}else{S.clients.delete(id);lsSave();render()}}
async function saveSettings(){if(db){await db.doc("settings/main").set(S.settings)}else{lsSave();render()}}
function dbErr(e){const m=e&&e.code==="quota_exceeded"?"存储已满，请删除部分旧记录后再试":e&&e.code==="invalid_argument"?"你没有修改这个账本的权限":"保存失败，请稍后重试";toast(m)}

async function boot(){
  try{const p=localStorage.getItem("boli-prefs");if(p){const o=JSON.parse(p);if(CURS.includes(o.disp))S.disp=o.disp;if(o.period)S.period=o.period;if(o.view)S.view=o.view}}catch(e){}
  syncControls();
  const fromHash=location.hash.slice(1);if(["dash","ledger","clients","rates"].includes(fromHash))S.view=fromHash;
  if(window.claude&&typeof window.claude.use==="function"){
    try{[db,downloads]=await Promise.all([claude.use("db"),claude.use("downloads").catch(()=>null)])}catch(e){db=null}
  }
  if(!db){S.mode="local";lsLoad();S.ready={t:true,c:true,s:true};render();return}
  S.mode="db";
  const timer=setTimeout(()=>{S.stale=true;S.ready={t:true,c:true,s:true};render()},10000);
  const done=()=>{if(S.ready.t&&S.ready.c&&S.ready.s){clearTimeout(timer);S.stale=false}render()};
  db.collection("txns").onSnapshot(snap=>{S.txns=new Map(snap.docs.map(d=>[d.id,{id:d.id,...d.data()}]));if(!snap.metadata.fromCache)S.ready.t=true;done()},e=>{S.ready.t=true;S.err=e;done()});
  db.collection("clients").onSnapshot(snap=>{S.clients=new Map(snap.docs.map(d=>[d.id,{id:d.id,...d.data()}]));if(!snap.metadata.fromCache)S.ready.c=true;done()},e=>{S.ready.c=true;done()});
  db.doc("settings/main").onSnapshot(s=>{if(s.exists){const d=s.data();S.settings={...DEFAULT_SETTINGS,...d,rates:{...DEFAULT_SETTINGS.rates,...(d.rates||{})}}}if(!s.metadata.fromCache)S.ready.s=true;done()},e=>{S.ready.s=true;done()});
}
function savePrefs(){try{localStorage.setItem("boli-prefs",JSON.stringify({disp:S.disp,period:S.period,view:S.view}))}catch(e){}}

/* ---------- period ---------- */
function periodRange(){
  const d=new Date(),y=d.getFullYear(),m=d.getMonth();
  const iso=x=>x.getFullYear()+"-"+String(x.getMonth()+1).padStart(2,"0")+"-"+String(x.getDate()).padStart(2,"0");
  switch(S.period){
    case "month":return [iso(new Date(y,m,1)),iso(new Date(y,m+1,0)),"本月"];
    case "lastmonth":return [iso(new Date(y,m-1,1)),iso(new Date(y,m,0)),"上月"];
    case "quarter":return [iso(new Date(y,m-2,1)),iso(new Date(y,m+1,0)),"近3个月"];
    case "year":return [y+"-01-01",y+"-12-31","今年"];
    case "custom":return [S.from||"0000-01-01",S.to||"9999-12-31",(S.from||"…")+" 至 "+(S.to||"…")];
    default:return ["0000-01-01","9999-12-31","全部"];
  }
}
const allTx=()=>[...S.txns.values()].sort((a,b)=>(b.date||"").localeCompare(a.date||"")||(b.createdAt||0)-(a.createdAt||0));
function inPeriod(t){const [a,b]=periodRange();return t.date>=a&&t.date<=b}

function totals(list,D){
  let inc=0,exp=0,fx=0,recv=0,pay=0;
  for(const t of list){const v=txValue(t,D);inc+=v.inc;exp+=v.exp;fx+=v.fx;
    if(t.status==="pending"){if(t.type==="in")recv+=v.inc;if(t.type==="out")pay+=v.exp}}
  return {inc,exp,fx,profit:inc-exp+fx,recv,pay,count:list.length};
}
function balances(list){
  const b={CNY:0,USD:0,KZT:0};
  for(const t of list){if(t.status==="pending")continue;const a=num(t.amount),f=num(t.fee);
    if(t.type==="in")b[t.currency]+=a-f;else if(t.type==="out")b[t.currency]-=a+f;else{b[t.currency]-=a+f;b[t.toCurrency]+=num(t.toAmount)}}
  return b;
}
function clientNames(){
  const set=new Map();
  for(const c of S.clients.values())if(c.name)set.set(c.name,c);
  for(const t of S.txns.values())if(t.client&&!set.has(t.client))set.set(t.client,null);
  return [...set.keys()].sort((a,b)=>a.localeCompare(b,"zh"));
}

/* ---------- render ---------- */
function syncControls(){
  document.querySelectorAll("#tabs button,#bnav button").forEach(b=>b.setAttribute("aria-selected",String(b.dataset.v===S.view)));
  document.querySelectorAll("#dispCur button").forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.c===S.disp)));
  $("#period").value=S.period;$("#customRange").hidden=S.period!=="custom";
}
function render(){
  syncControls();
  const m=$("#main");
  if(S.mode==="loading"||(S.mode==="db"&&!(S.ready.t&&S.ready.c&&S.ready.s))){m.innerHTML='<div class="loading">正在打开账本…</div>';return}
  let html="";
  if(S.mode==="local")html+='<div class="banner"><b>本机模式</b>数据只保存在这个浏览器里。请定期用「流水 → 导出」备份。</div>';
  if(S.stale)html+='<div class="banner"><b>连接较慢</b>账本数据暂时无法刷新，显示的可能不是最新内容。</div>';
  const demo=[...S.txns.values()].some(t=>t.demo);
  if(demo)html+='<div class="banner"><b>示例数据</b>当前账本包含示例记录，用来演示功能。<button class="btn" id="clearDemo" type="button">删除所有示例记录</button></div>';
  if(S.txns.size===0&&S.view!=="rates")html+=emptyState();
  else html+=({dash:viewDash,ledger:viewLedger,clients:viewClients,rates:viewRates}[S.view])();
  m.innerHTML=html;
  bindView();
}
function emptyState(){
  return `<div class="card emptystate"><h3>账本还是空的</h3><p>点右下角「记一笔」添加第一笔进账或出账。每笔都会记下当时的美元、坚戈、人民币汇率，自动折算利润。</p>
  <div class="ctrls"><button class="btn primary" type="button" data-act="new">记第一笔</button><button class="btn" type="button" id="loadDemo">载入示例数据看看</button></div></div>`;
}

/* dashboard */
function viewDash(){
  const D=S.disp,list=allTx().filter(inPeriod),T=totals(list,D),[,,plabel]=periodRange();
  const margin=T.inc?T.profit/T.inc*100:0;
  const bal=balances(allTx());
  let h=`<section class="grid g-kpi">
    <div class="card kpi in"><span class="lbl">进账 · ${plabel}</span><span class="val">${fmt(T.inc,D)}</span><span class="sub">${list.filter(t=>t.type==="in").length} 笔${T.recv?` · 待收 ${fmt(T.recv,D)}`:""}</span></div>
    <div class="card kpi out"><span class="lbl">出账 · ${plabel}</span><span class="val">${fmt(T.exp,D)}</span><span class="sub">${list.filter(t=>t.type==="out").length} 笔${T.pay?` · 待付 ${fmt(T.pay,D)}`:""}</span></div>
    <div class="card kpi profit"><span class="lbl">净利润 · ${plabel}</span><span class="val">${fmt(T.profit,D)}</span><span class="sub">利润率 ${margin.toFixed(1)}%${T.fx?` · 含汇兑 ${fmt(T.fx,D,{plus:true})}`:""}</span></div>
    <div class="card kpi"><span class="lbl">应收 / 应付（全部未结）</span><span class="val">${(()=>{const A=totals(allTx(),D);return fmt(A.recv-A.pay,D)})()}</span><span class="sub">${(()=>{const A=totals(allTx(),D);return `应收 ${fmt(A.recv,D)} · 应付 ${fmt(A.pay,D)}`})()}</span></div>
  </section>`;
  h+=`<section class="grid g-2"><div class="card"><h2>月度进出与利润 <span class="hint">按每笔当时汇率折算为 ${CNAME[D]}</span></h2>${monthChart(D)}</div>
    <div class="card"><h2>各币种余额 <span class="hint">已结清 · 原币</span></h2><div class="bal">${CURS.map(c=>`
      <div class="bal-row"><span class="sym c-${c}">${SYM[c]}</span><div><b>${CNAME[c]} ${c}</b><div class="nm">≈ ${fmt(conv(bal[c],c,D,S.settings.rates),D)} 按当前汇率</div></div><span class="amt ${bal[c]<0?"neg":""}">${fmt(bal[c],c)}</span></div>`).join("")}
      <div class="bal-row" style="background:var(--accent-soft)"><span class="sym" style="background:var(--accent);color:var(--accent-ink)">Σ</span><div><b>合计</b><div class="nm">按当前汇率折算</div></div><span class="amt">${fmt(CURS.reduce((s,c)=>s+conv(bal[c],c,D,S.settings.rates),0),D)}</span></div>
    </div></div></section>`;
  // clients & categories
  const byClient=new Map();
  for(const t of list){if(!t.client||t.type==="fx")continue;const v=txValue(t,D);const o=byClient.get(t.client)||{inc:0,exp:0};o.inc+=v.inc;o.exp+=v.exp;byClient.set(t.client,o)}
  const topC=[...byClient.entries()].map(([n,o])=>({n,p:o.inc-o.exp,inc:o.inc})).sort((a,b)=>b.p-a.p).slice(0,6);
  const maxP=Math.max(1,...topC.map(x=>Math.abs(x.p)));
  const byCat=new Map();for(const t of list){if(t.type!=="out")continue;const k=t.category||"其他支出";byCat.set(k,(byCat.get(k)||0)+txValue(t,D).exp)}
  const cats=[...byCat.entries()].sort((a,b)=>b[1]-a[1]);const maxC=Math.max(1,...cats.map(c=>c[1]));
  const byCur={CNY:0,USD:0,KZT:0};for(const t of list){if(t.type==="in")byCur[t.currency]+=txValue(t,D).inc}
  const curTot=Object.values(byCur).reduce((a,b)=>a+b,0)||1;
  h+=`<section class="grid g-3">
    <div class="card"><h2>客户利润排行</h2>${topC.length?`<div class="hbar">${topC.map(x=>`<div class="hbar-row"><span class="lab" title="${esc(x.n)}">${esc(x.n)}</span><div class="hbar-track"><div class="hbar-fill" style="width:${Math.abs(x.p)/maxP*100}%;background:${x.p>=0?"var(--in)":"var(--out)"}"></div></div><span class="num ${x.p<0?"neg":""}">${compact(x.p,D)}</span></div>`).join("")}</div>`:'<div class="empty-note">这个期间没有关联客户的记录</div>'}</div>
    <div class="card"><h2>支出构成</h2>${cats.length?`<div class="hbar">${cats.map(([k,v])=>`<div class="hbar-row"><span class="lab">${esc(k)}</span><div class="hbar-track"><div class="hbar-fill" style="width:${v/maxC*100}%;background:var(--out)"></div></div><span class="num">${compact(v,D)}</span></div>`).join("")}</div>`:'<div class="empty-note">这个期间没有支出</div>'}</div>
    <div class="card"><h2>收入币种构成</h2><div class="hbar">${CURS.map(c=>`<div class="hbar-row"><span class="lab"><span class="chip c-${c}">${c}</span></span><div class="hbar-track"><div class="hbar-fill" style="width:${byCur[c]/curTot*100}%;background:var(--${c.toLowerCase()})"></div></div><span class="num">${(byCur[c]/curTot*100).toFixed(0)}%</span></div>`).join("")}</div></div>
  </section>`;
  const recent=allTx().slice(0,6);
  h+=`<section class="card"><h2>最近记录 <button class="btn ghost" type="button" data-goto="ledger">查看全部 →</button></h2><div class="rows">${recent.map(rowHTML).join("")}</div></section>`;
  return h;
}
function monthChart(D){
  const [a,b]=periodRange();
  const all=allTx();
  let endKey=b.startsWith("9999")?(all[0]?.date||today()).slice(0,7):b.slice(0,7);
  let startKey=a.startsWith("0000")?(all.length?all[all.length-1].date.slice(0,7):null):a.slice(0,7);
  const months=[];let [y,m]=endKey.split("-").map(Number);
  for(let i=0;i<12;i++){const k=y+"-"+String(m).padStart(2,"0");months.unshift(k);if(startKey&&k<=startKey&&months.length>=3)break;m--;if(m===0){m=12;y--}}
  while(months.length<3){let [yy,mm]=months[0].split("-").map(Number);mm--;if(!mm){mm=12;yy--}months.unshift(yy+"-"+String(mm).padStart(2,"0"))}
  const data=months.map(k=>{const T=totals(all.filter(t=>(t.date||"").startsWith(k)),D);return {k,...T}});
  const W=640,H=250,pl=58,pr=12,pt=14,pb=30;
  const maxV=Math.max(1,...data.map(d=>Math.max(d.inc,d.exp))),minP=Math.min(0,...data.map(d=>d.profit));
  const top=niceCeil(maxV),bot=minP<0?-niceCeil(-minP):0;
  const y_=v=>pt+(top-v)/(top-bot)*(H-pt-pb);
  const bw=(W-pl-pr)/data.length;
  let g="";
  const ticks=4;for(let i=0;i<=ticks;i++){const v=bot+(top-bot)*i/ticks;const yy=y_(v);g+=`<line x1="${pl}" x2="${W-pr}" y1="${yy}" y2="${yy}" stroke="var(--line)" stroke-width="1"/><text x="${pl-8}" y="${yy+4}" text-anchor="end" font-size="10" fill="var(--muted)" font-family="JetBrains Mono,monospace">${esc(compact(v,D))}</text>`}
  if(bot<0)g+=`<line x1="${pl}" x2="${W-pr}" y1="${y_(0)}" y2="${y_(0)}" stroke="var(--muted)" stroke-width="1"/>`;
  const pts=[];
  data.forEach((d,i)=>{const x=pl+i*bw,w=Math.min(18,bw*.3);
    g+=`<rect x="${x+bw/2-w-1}" y="${y_(d.inc)}" width="${w}" height="${Math.max(0,y_(0)-y_(d.inc))}" rx="3" fill="var(--in)"><title>${d.k} 进账 ${fmt(d.inc,D)}</title></rect>`;
    g+=`<rect x="${x+bw/2+1}" y="${y_(d.exp)}" width="${w}" height="${Math.max(0,y_(0)-y_(d.exp))}" rx="3" fill="var(--out)" opacity=".85"><title>${d.k} 出账 ${fmt(d.exp,D)}</title></rect>`;
    g+=`<text x="${x+bw/2}" y="${H-10}" text-anchor="middle" font-size="10" fill="var(--muted)">${+d.k.slice(5)}月</text>`;
    pts.push([x+bw/2,y_(d.profit),d]);
  });
  g+=`<polyline points="${pts.map(p=>p[0]+","+p[1]).join(" ")}" fill="none" stroke="var(--accent)" stroke-width="2.2" stroke-linejoin="round"/>`;
  pts.forEach((p,i)=>{g+=`<circle cx="${p[0]}" cy="${p[1]}" r="${i===pts.length-1?4.5:3}" fill="var(--panel)" stroke="var(--accent)" stroke-width="2"><title>${p[2].k} 利润 ${fmt(p[2].profit,D)}</title></circle>`});
  const last=pts[pts.length-1];g+=`<text x="${Math.min(last[0],W-pr-4)}" y="${last[1]-10}" text-anchor="end" font-size="11" font-weight="700" fill="var(--accent)" font-family="JetBrains Mono,monospace">${esc(compact(last[2].profit,D))}</text>`;
  return `<div class="chart-wrap"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="月度进出账柱状图">${g}</svg></div><div class="legend"><span><i style="background:var(--in)"></i>进账</span><span><i style="background:var(--out)"></i>出账</span><span><i style="background:var(--accent);height:3px;vertical-align:3px"></i>净利润（含汇兑）</span></div>`;
}
function niceCeil(v){const p=Math.pow(10,Math.floor(Math.log10(v)));const n=v/p;return (n<=1?1:n<=2?2:n<=2.5?2.5:n<=5?5:10)*p}

/* ledger */
function rowHTML(t){
  const D=S.disp,v=txValue(t,D);
  let amt,conv_,tag;
  if(t.type==="fx"){
    amt=`<span class="neg">${fmt(-num(t.amount),t.currency)}</span><small class="pos">${fmt(num(t.toAmount),t.toCurrency,{plus:true})}</small>`;
    conv_=`<span class="${v.fx<0?"neg":"pos"}">${fmt(v.fx,D,{plus:true})}</span><small>汇兑损益</small>`;tag='<span class="chip t-fx">换汇</span>';
  }else{
    const sign=t.type==="in"?1:-1;amt=`<span class="${t.type==="in"?"pos":"neg"}">${fmt(sign*num(t.amount),t.currency,{plus:true})}</span>${num(t.fee)?`<small>手续费 ${fmt(num(t.fee),t.currency)}</small>`:""}`;
    conv_=`${fmt(sign*(v.inc||v.exp),D,{plus:true})}`;tag=`<span class="chip ${t.type==="in"?"t-in":"t-out"}">${t.type==="in"?"进账":"出账"}</span>`;
  }
  const rateTxt=t.currency==="USD"&&t.type!=="fx"?`1$=¥${rfmt(rateOf(t.rates,"CNY"))}`:t.type==="fx"?`1${t.currency}=${rfmt(num(t.toAmount)/(num(t.amount)||1))}${t.toCurrency}`:`1$=${rfmt(rateOf(t.rates,t.currency))}${SYM[t.currency]}`;
  return `<div class="row" data-id="${esc(t.id)}" tabindex="0" role="button"><span class="d">${esc(t.date)}</span>
    <div class="who"><b>${esc(t.client||t.category||"未指定客户")}</b><span>${tag}<span class="chip c-${t.currency}">${t.currency}</span>${t.status==="pending"?`<span class="chip st-pending">${t.type==="in"?"待收":"待付"}</span>`:""}${esc(t.client?t.category||"":"")}${t.note?" · "+esc(t.note):""}<span class="num" style="opacity:.8">${esc(rateTxt)}</span></span></div>
    <div class="amt">${amt}</div><div class="amt conv">${conv_}</div></div>`;
}
function filteredLedger(){
  const f=S.lf,q=f.q.trim().toLowerCase();
  return allTx().filter(inPeriod).filter(t=>(!f.type||t.type===f.type)&&(!f.cur||t.currency===f.cur||t.toCurrency===f.cur)&&(!f.client||t.client===f.client)&&(!f.cat||t.category===f.cat)&&(!f.status||(t.status||"done")===f.status)
    &&(!q||[t.client,t.category,t.note,t.ref,t.amount,t.date].join(" ").toLowerCase().includes(q)));
}

  const f=S.lf,D=S.disp,list=filteredLedger(),T=totals(list,D),[,,plabel]=periodRange();
  const cats=[...new Set([...CATS.in,...CATS.out,...allTx().map(t=>t.category).filter(Boolean)])];
  const orig={};for(const t of list){if(t.type==="fx")continue;const s=t.type==="in"?1:-1;orig[t.currency]=(orig[t.currency]||0)+s*num(t.amount)}
  return `<section class="card" style="display:grid;gap:12px">
    <h2>流水账 · ${plabel} <span class="ctrls"><button class="btn" type="button" id="exportCsv">导出 CSV</button><button class="btn" type="button" id="exportJson">备份 JSON</button></span></h2>
    <div class="filters">
      <input class="pill grow" id="f-q" placeholder="搜索客户、备注、单号、金额…" value="${esc(f.q)}">
      <select class="pill" id="f-type"><option value="">全部类型</option><option value="in">进账</option><option value="out">出账</option><option value="fx">换汇</option></select>
      <select class="pill" id="f-cur"><option value="">全部币种</option>${CURS.map(c=>`<option value="${c}">${c} ${CNAME[c]}</option>`).join("")}</select>
      <select class="pill" id="f-client"><option value="">全部客户</option>${clientNames().map(n=>`<option value="${esc(n)}">${esc(n)}</option>`).join("")}</select>
      <select class="pill" id="f-cat"><option value="">全部类别</option>${cats.map(c=>`<option value="${esc(c)}">${esc(c)}</option>`).join("")}</select>
      <select class="pill" id="f-status"><option value="">全部状态</option><option value="done">已结清</option><option value="pending">未结清</option></select>

function readTx(){
  const g=id=>{const el=$("#"+id);return el?el.value:undefined};
  F.date=g("tx-date");F.client=g("tx-client").trim();F.amount=g("tx-amount");F.fee=g("tx-fee");
  F.rates={CNY:g("tx-rcny"),KZT:g("tx-rkzt")};
  if(F.type==="fx"){F.toAmount=g("tx-toAmount");F.category="换汇";F.status="done"}else{F.category=g("tx-cat");F.status=g("tx-status")}
  F.ref=g("tx-ref");F.note=g("tx-note");
}
function calcTx(){
  readTx();
  const t=F,r={CNY:num(t.rates.CNY),KZT:num(t.rates.KZT)},a=num(t.amount),f=num(t.fee);
  let h=`<div class="r"><span>交叉汇率</span><b>1 CNY = ${r.CNY?rfmt(r.KZT/r.CNY,3):"—"} KZT</b></div>`;
  if(t.type==="fx"){
    const got=num(t.toAmount),book=conv(a+f,t.currency,t.toCurrency,r),impl=a?got/a:0;
    h+=`<div class="r"><span>实际成交汇率</span><b>1 ${t.currency} = ${rfmt(impl,4)} ${t.toCurrency}</b></div>
       <div class="r"><span>按本笔汇率应得</span><b>${fmt(book,t.toCurrency)}</b></div>
       <div class="r hl"><span>汇兑损益（${CNAME[S.disp]}）</span><b class="${got-book<0?"neg":"pos"}">${fmt(conv(got-book,t.toCurrency,S.disp,r),S.disp,{plus:true})}</b></div>`;
  }else{
    const net=t.type==="in"?a-f:a+f;
    h+=`<div class="r"><span>${t.type==="in"?"实收（扣手续费）":"实付（含手续费）"}</span><b>${fmt(net,t.currency)}</b></div>`;
    h+=CURS.filter(c=>c!==t.currency).map(c=>`<div class="r hl"><span>折合${CNAME[c]}</span><b>${fmt(conv(net,t.currency,c,r),c)}</b></div>`).join("");
  }
  $("#tx-calc").innerHTML=h;
}
function validTx(){
  const t=F;
  if(!t.date)return "请选择日期";
  if(!(num(t.amount)>0))return "请输入大于 0 的金额";
  if(!(num(t.rates.CNY)>0)||!(num(t.rates.KZT)>0))return "汇率必须大于 0";
  if(t.type==="fx"){if(t.toCurrency===t.currency)return "买入币种不能和卖出币种相同";if(!(num(t.toAmount)>0))return "请输入换汇到账金额"}
  return "";
}

async function offer(filename,data){
  if(downloads){try{await downloads.save({filename,data});return}catch(e){if(e&&e.code==="declined")return;toast("这里无法保存文件，请在浏览器中打开账本再导出");return}}
  try{const b=new Blob([data]);const a=document.createElement("a");a.href=URL.createObjectURL(b);a.download=filename;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000)}catch(e){toast("无法导出")}

function csv(){
  const D=S.disp,head=["日期","类型","客户","类别","币种","金额","手续费","换入币种","换入金额","USD/CNY","USD/KZT","折合"+D,"状态","单号","备注"];
  const q=v=>{const s=String(v??"");return /[",\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s};
  const rows=filteredLedger().map(t=>{const v=txValue(t,D);return [t.date,{in:"进账",out:"出账",fx:"换汇"}[t.type],t.client,t.category,t.currency,t.amount,t.fee||0,t.toCurrency||"",t.toAmount||"",rateOf(t.rates,"CNY"),rateOf(t.rates,"KZT"),(t.type==="in"?v.inc:t.type==="out"?-v.exp:v.fx).toFixed(2),t.status==="pending"?"未结清":"已结清",t.ref,t.note].map(q).join(",")});
  return "﻿"+[head.join(","),...rows].join("\n");
}

async function clearDemo(btn){
  if(!btn.classList.contains("armed")){btn.classList.add("armed","danger");btn.textContent="确认删除示例记录";return}
  try{for(const t of [...S.txns.values()].filter(t=>t.demo))await delTxn(t.id);for(const c of [...S.clients.values()].filter(c=>c.demo))await delClient(c.id);toast("示例记录已删除")}catch(e){dbErr(e)}
}

/* ---------- events ---------- */
function setView(v){S.view=v;savePrefs();try{history.replaceState(null,"","#"+v)}catch(e){}render();window.scrollTo({top:0})}
function bindView(){
  const m=$("#main");
  m.querySelectorAll(".row[data-id]").forEach(r=>{r.onclick=()=>openTx(r.dataset.id);r.onkeydown=e=>{if(e.key==="Enter")openTx(r.dataset.id)}});
  m.querySelectorAll("[data-goto]").forEach(b=>b.onclick=()=>setView(b.dataset.goto));
  m.querySelectorAll("[data-act=new]").forEach(b=>b.onclick=()=>openTx());
  const ld=$("#loadDemo");if(ld)ld.onclick=loadDemo;
  const cd=$("#clearDemo");if(cd)cd.onclick=()=>clearDemo(cd);
  if(S.view==="ledger"&&$("#f-q")){
    for(const k of ["type","cur","client","cat","status"]){const el=$("#f-"+k);if(!el)continue;el.value=S.lf[k];el.onchange=()=>{S.lf[k]=el.value;render()}}
    let tm;$("#f-q").oninput=e=>{clearTimeout(tm);tm=setTimeout(()=>{S.lf.q=e.target.value;render();const q=$("#f-q");q.focus();q.setSelectionRange(q.value.length,q.value.length)},250)};
    const rs=$("#f-reset");if(rs)rs.onclick=()=>{S.lf={q:"",type:"",cur:"",client:"",cat:"",status:""};render()};
    $("#exportCsv").onclick=()=>offer("boli-流水-"+today()+".csv",csv());
    $("#exportJson").onclick=()=>offer("boli-备份-"+today()+".json",JSON.stringify({txns:allTx(),clients:[...S.clients.values()],settings:S.settings},null,1));
  }
  if(S.view==="clients"){
    const nc=$("#newClient");if(nc)nc.onclick=()=>openClient();
    m.querySelectorAll("[data-editclient]").forEach(b=>b.onclick=e=>{e.stopPropagation();openClient(b.dataset.editclient)});
    m.querySelectorAll("[data-client]").forEach(c=>{const go=()=>{S.lf={q:"",type:"",cur:"",client:c.dataset.client,cat:"",status:""};setView("ledger")};c.onclick=go;c.onkeydown=e=>{if(e.key==="Enter")go()}});
  }
  if(S.view==="rates"&&$("#r-cny")){
    ["r-cny","r-kzt","cv-amt","cv-from"].forEach(id=>{$("#"+id).oninput=updateRatesView});updateRatesView();
    $("#saveRates").onclick=async()=>{const c=num($("#r-cny").value),k=num($("#r-kzt").value);if(!(c>0&&k>0)){toast("汇率必须大于 0");return}
      S.settings={...S.settings,rates:{CNY:c,KZT:k},updated:today()};try{await saveSettings();toast("汇率已保存")}catch(e){dbErr(e)}};
  }
}
document.addEventListener("click",e=>{
  const tb=e.target.closest("#tabs button,#bnav button");if(tb){setView(tb.dataset.v);return}
  const dc=e.target.closest("#dispCur button");if(dc){S.disp=dc.dataset.c;savePrefs();render();return}
  if(e.target.closest("[data-close]")||e.target.id==="scrim"){closeModal();return}
  if(!F)return;
  const ty=e.target.closest(".typeseg button");if(ty){readTx();F.type=ty.dataset.t;F.category=CATS[F.type][0];if(F.type==="fx"&&F.toCurrency===F.currency)F.toCurrency=CURS.find(c=>c!==F.currency);drawTx();return}
  const cu=e.target.closest("#tx-cur button");if(cu){readTx();F.currency=cu.dataset.c;if(F.toCurrency===F.currency)F.toCurrency=CURS.find(c=>c!==F.currency);drawTx();return}
  const tc=e.target.closest("#tx-tocur button");if(tc&&!tc.disabled){readTx();F.toCurrency=tc.dataset.c;drawTx();return}
  if(e.target.id==="tx-del"){const b=e.target;if(!b.classList.contains("armed")){b.classList.add("armed");b.textContent="再点一次确认删除";return}
    delTxn(F.id).then(()=>{closeModal();toast("已删除")}).catch(dbErr);return}
  if(e.target.id==="tx-dup"){readTx();const c={...F};delete c.id;c.date=today();c.createdAt=Date.now();delete c.demo;F=c;drawTx();toast("已复制，修改后保存");return}
});
document.addEventListener("input",e=>{if(F&&e.target.closest("#txForm"))calcTx()});
document.addEventListener("submit",e=>{if(e.target.id==="txForm"){e.preventDefault();submitTx()}});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&$("#modal").innerHTML)closeModal()});
$("#fab").onclick=()=>openTx();
$("#period").onchange=e=>{S.period=e.target.value;if(S.period==="custom"&&!S.from){const d=new Date();S.from=d.getFullYear()+"-01-01";S.to=today();$("#from").value=S.from;$("#to").value=S.to}savePrefs();render()};
$("#from").onchange=e=>{S.from=e.target.value;render()};$("#to").onchange=e=>{S.to=e.target.value;render()};
window.addEventListener("hashchange",()=>{const h=location.hash.slice(1);if(["dash","ledger","clients","rates"].includes(h)&&h!==S.view){S.view=h;render()}});

boot();
})();
</script>
